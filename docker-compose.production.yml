services:
  caddy:
    image: caddy:2-alpine
    container_name: kaanviz-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN:-localhost}
      - API_DOMAIN=${API_DOMAIN:-api.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kaanviz-net
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: kaanviz-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - kaanviz-net
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaanviz-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-kaanviz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kaanviz_db}
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BASE_PATH=/app/storage
      - STORAGE_RAW_PATH=/app/storage/raw
      - STORAGE_PROCESSED_PATH=/app/storage/processed
      - STORAGE_METADATA_PATH=/app/storage/metadata
      - STORAGE_EXPORTS_PATH=/app/storage/exports
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_PROVIDER=${AI_PROVIDER:-nvidia}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-nvidia/nemotron-3-super-120b-a12b}
    volumes:
      - ./storage:/app/storage
    networks:
      - kaanviz-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: kaanviz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaanviz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaanviz_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-kaanviz_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kaanviz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaanviz} -d ${POSTGRES_DB:-kaanviz_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kaanviz-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - kaanviz-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  kaanviz-net:
    driver: bridge
